<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 Player Fighter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #1b1b1b, #333);
    }

    .ui {
      position: absolute;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
      pointer-events: none;
    }

    .health-container {
      width: 320px;
    }

    .health-label {
      color: white;
      font-size: 18px;
      margin-bottom: 8px;
      text-shadow: 1px 1px 2px black;
    }

    .health-bar {
      width: 100%;
      height: 28px;
      background: #500;
      border: 3px solid white;
      overflow: hidden;
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(to right, #00ff66, #66ff66);
      transition: width 0.12s linear;
    }

    #winnerText {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 56px;
      font-weight: bold;
      text-align: center;
      display: none;
      text-shadow: 3px 3px 6px black;
    }

    #winnerText small {
      display: block;
      margin-top: 12px;
      font-size: 24px;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="health-container">
      <div class="health-label">Player 2</div>
      <div class="health-bar">
        <div class="health-fill" id="p2Health"></div>
      </div>
    </div>

    <div class="health-container">
      <div class="health-label" style="text-align:right;">Player 1</div>
      <div class="health-bar">
        <div class="health-fill" id="p1Health"></div>
      </div>
    </div>
  </div>

  <div id="winnerText"></div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      groundY = canvas.height - 120;
    }

    window.addEventListener('resize', resize);

    let groundY = 0;
    resize();

    const gravity = 0.8;
    const floorHeight = 80;

    const keys = {};
    let gameOver = false;

    class Fighter {
      constructor(options) {
        Object.assign(this, options);

        this.width = 60;
        this.height = 110;
        this.velocityX = 0;
        this.velocityY = 0;

        this.speed = 6;
        this.jumpStrength = 16;

        this.onGround = false;

        this.maxHealth = 10;
        this.health = 10;

        this.isBlocking = false;
        this.isAttacking = false;

        this.attackCooldown = 0;
        this.attackDuration = 10;

        this.freezeFrames = 0;
        this.invulnerableFrames = 0;
        this.flashTimer = 0;
      }

      get facingDirection() {
        return this.x < opponentOf(this).x ? 1 : -1;
      }

      update() {
        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.freezeFrames > 0) {
          this.freezeFrames--;
          return;
        }

        if (this.invulnerableFrames > 0) {
          this.invulnerableFrames--;
          this.flashTimer++;
        }

        this.handleMovement();

        this.x += this.velocityX;
        this.y += this.velocityY;

        this.velocityY += gravity;

        if (this.y + this.height >= groundY) {
          this.y = groundY - this.height;
          this.velocityY = 0;
          this.onGround = true;
        } else {
          this.onGround = false;
        }

        this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));
      }

      handleMovement() {
        this.velocityX = 0;

        if (this.isAttacking) return;

        const left = keys[this.controls.left];
        const right = keys[this.controls.right];

        if (left) this.velocityX = -this.speed;
        if (right) this.velocityX = this.speed;

        this.isBlocking = !!keys[this.controls.block];

        if (this.isBlocking) {
          this.velocityX *= 0.3;
        }
      }

      jump() {
        if (this.onGround && !this.isBlocking && !this.isAttacking) {
          this.velocityY = -this.jumpStrength;
        }
      }

      attack() {
        if (
          this.isAttacking ||
          this.attackCooldown > 0 ||
          this.isBlocking ||
          this.freezeFrames > 0
        ) {
          return;
        }

        this.isAttacking = true;
        this.attackCooldown = 24;

        setTimeout(() => {
          this.checkHit();
        }, 80);

        setTimeout(() => {
          this.isAttacking = false;
        }, this.attackDuration * 16);
      }

      checkHit() {
        const enemy = opponentOf(this);

        const attackRange = 80;
        const dx = enemy.x - this.x;
        const facingCorrectly = Math.sign(dx) === this.facingDirection;
        const closeEnough = Math.abs(dx) < attackRange;
        const verticalHit = Math.abs(enemy.y - this.y) < 90;

        if (
          facingCorrectly &&
          closeEnough &&
          verticalHit &&
          enemy.invulnerableFrames <= 0
        ) {
          if (!enemy.isBlocking) {
            enemy.takeHit();
          }
        }
      }

      takeHit() {
        this.health = Math.max(0, this.health - 1);
        this.freezeFrames = 18;
        this.invulnerableFrames = 30;
        this.flashTimer = 0;

        updateHealthBars();

        if (this.health <= 0) {
          endGame(opponentOf(this));
        }
      }

      draw() {
        const flashing =
          this.invulnerableFrames > 0 &&
          Math.floor(this.flashTimer / 3) % 2 === 0;

        if (flashing) return;

        ctx.save();

        const centerX = this.x + this.width / 2;
        const headY = this.y + 16;
        const bodyY = this.y + 42;

        let bodyColor = this.color;

        if (this.isBlocking) {
          bodyColor = '#3498db';
        }

        if (this.isAttacking) {
          bodyColor = '#f1c40f';
        }

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(centerX, groundY + 6, 28, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath();
        ctx.arc(centerX, headY, 16, 0, Math.PI * 2);
        ctx.fill();

        // Hair
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(centerX, headY - 4, 16, Math.PI, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(centerX - 5, headY - 2, 2, 0, Math.PI * 2);
        ctx.arc(centerX + 5, headY - 2, 2, 0, Math.PI * 2);
        ctx.fill();

        // Torso
        ctx.fillStyle = bodyColor;
        ctx.fillRect(centerX - 16, bodyY, 32, 42);

        // Belt
        ctx.fillStyle = '#111';
        ctx.fillRect(centerX - 16, bodyY + 32, 32, 6);

        // Arms
        ctx.strokeStyle = bodyColor;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';

        const attackExtend = this.isAttacking ? 26 : 0;
        const frontArmX = centerX + (this.facingDirection * (24 + attackExtend));
        const backArmX = centerX - (this.facingDirection * 18);

        // Back arm
        ctx.beginPath();
        ctx.moveTo(centerX, bodyY + 10);
        ctx.lineTo(backArmX, bodyY + 28);
        ctx.stroke();

        // Front arm
        ctx.beginPath();
        ctx.moveTo(centerX, bodyY + 10);
        ctx.lineTo(frontArmX, bodyY + 18);
        ctx.stroke();

        // Hands
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath();
        ctx.arc(frontArmX, bodyY + 18, 5, 0, Math.PI * 2);
        ctx.arc(backArmX, bodyY + 28, 5, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 12;

        const legSpread = Math.abs(this.velocityX) > 0 ? 10 : 4;

        ctx.beginPath();
        ctx.moveTo(centerX - 8, bodyY + 42);
        ctx.lineTo(centerX - legSpread, bodyY + 78);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX + 8, bodyY + 42);
        ctx.lineTo(centerX + legSpread, bodyY + 78);
        ctx.stroke();

        // Feet
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 5;

        ctx.beginPath();
        ctx.moveTo(centerX - legSpread - 8, bodyY + 78);
        ctx.lineTo(centerX - legSpread + 6, bodyY + 78);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX + legSpread - 8, bodyY + 78);
        ctx.lineTo(centerX + legSpread + 6, bodyY + 78);
        ctx.stroke();

        // Attack effect
        if (this.isAttacking) {
          ctx.strokeStyle = '#ff5555';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(frontArmX, bodyY + 18, 14, 0, Math.PI * 1.5);
          ctx.stroke();
        }

        // Blocking shield
        if (this.isBlocking) {
          const shieldX = centerX + this.facingDirection * 34;

          ctx.fillStyle = 'rgba(120,220,255,0.35)';
          ctx.beginPath();
          ctx.arc(shieldX, bodyY + 16, 18, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#9be7ff';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    const player1 = new Fighter({
      x: canvas.width - 180,
      y: groundY - 110,
      color: '#e74c3c',
      controls: {
        left: 'ArrowLeft',
        right: 'ArrowRight',
        jump: 'ArrowUp',
        block: 'ArrowDown',
        attack: 'Shift'
      }
    });

    const player2 = new Fighter({
      x: 120,
      y: groundY - 110,
      color: '#2ecc71',
      controls: {
        left: 'a',
        right: 'd',
        jump: 'w',
        block: 's',
        attack: 't'
      }
    });

    function opponentOf(player) {
      return player === player1 ? player2 : player1;
    }

    function updateHealthBars() {
      document.getElementById('p1Health').style.width = `${player1.health * 10}%`;
      document.getElementById('p2Health').style.width = `${player2.health * 10}%`;
    }

    updateHealthBars();

    function endGame(winner) {
      gameOver = true;

      const winnerText = document.getElementById('winnerText');
      winnerText.style.display = 'block';
      winnerText.innerHTML = `
        ${winner === player1 ? 'Player 1' : 'Player 2'} Wins!
        <small>Refresh the page to play again</small>
      `;
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;

      if (gameOver) return;

      if (e.key === player1.controls.jump) {
        player1.jump();
      }

      if (e.key === player2.controls.jump) {
        player2.jump();
      }

      if (e.key === player1.controls.attack) {
        player1.attack();
      }

      if (e.key === player2.controls.attack) {
        player2.attack();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function drawBackground() {
      ctx.fillStyle = '#222';
      ctx.fillRect(0, groundY, canvas.width, floorHeight);

      ctx.fillStyle = '#555';

      for (let i = 0; i < canvas.width; i += 60) {
        ctx.fillRect(i, groundY + 30, 30, 10);
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();

      player1.update();
      player2.update();

      player1.draw();
      player2.draw();

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
